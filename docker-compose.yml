services:
  postgres:
    image: postgres:17-alpine
    container_name: webflux-postgres
    environment:
      POSTGRES_DB: webflux_db
      POSTGRES_USER: webflux_user
      POSTGRES_PASSWORD: webflux_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webflux_user -d webflux_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

